schema_version: 1

context:
  name: diffusers
  version: 0.42.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/diffusers-${{ version }}.tar.gz
  sha256: e29c723d84251465743a515803a5bbd4e760ea9e9c1ebd4315f3b104d0c25bbe

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - importlib-metadata
    - filelock
    - huggingface_hub >=1.32.0,<3.0
    - numpy
    - regex !=2019.12.17
    - requests
    - safetensors >=0.8.0
    - pillow
tests:
  - python:
      imports:
        - diffusers
        - diffusers.models
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Diffusers
  license: Apache-2.0
  license_file: LICENSE
  description: |
    :hugs: Diffusers provides pretrained diffusion models across multiple modalities,
    such as vision and audio, and serves as a modular toolbox for inference and
    training of diffusion models.

    PyPI: [https://pypi.org/project/diffusers/](https://pypi.org/project/diffusers/)

  homepage: https://github.com/huggingface/diffusers
  repository: https://github.com/huggingface/diffusers
  documentation: https://github.com/huggingface/diffusers

extra:
  recipe-maintainers:
    - mukhery
    - sugatoray
    - xhochy
    # maintainers from upstream repo
    - anton-l
    - patrickvonplaten
